[meshishi_base]
extends = esp32_base
board = ESP32-S3-WROOM-1-N16R8
board_check = true
build_flags =
  ${esp32_base.build_flags}
  -I variants/meshishi
  -D PIN_STATUS_LED=1
  -D P_LORA_TX_LED=2
  -D P_LORA_DIO_1=42
  -D P_LORA_NSS=14
  -D P_LORA_RESET=40
  -D P_LORA_BUSY=41
  -D P_LORA_SCLK=21
  -D P_LORA_MOSI=38
  -D P_LORA_MISO=39
  -D SX126X_TXEN=9
  -D SX126X_RXEN=10
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=18
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/meshishi>
lib_deps =
  ${esp32_base.lib_deps}

[env:meshishi_repeater]
extends = meshishi_base
build_src_filter = ${meshishi_base.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${meshishi_base.build_flags}
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_RX_BOOSTED_GAIN=1
  -D ADVERT_NAME='"Meshishi Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${meshishi_base.lib_deps}
  ${esp32_ota.lib_deps}
